name: Vault checks

# Two guards that keep this vault usable on a phone:
#   1. every ```smiles / ```plot / ```circuit fence has its committed SVG up to date
#   2. every plugin ID the vault enables (and every plugin the docs recommend) really
#      exists in the Obsidian registry and is not desktop-only
# Desktop-only plugins are exactly why Molren, Ketcher, Plot Vectors and Graphs and
# Circuit Sketcher could not load on Android/iOS.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install figure dependencies
        run: pip install -r tools/requirements.txt

      # Manual run: render, prune and commit, so the phone only has to pull.
      - name: Render figures and commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 tools/render_figures.py --prune
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(figures): re-render from fences [skip ci]"
            git push
          else
            echo "Figures already up to date."
          fi

      - name: Fail if a committed figure is stale
        run: python3 tools/render_figures.py --check

      - name: Audit plugin IDs and mobile support
        run: python3 tools/check_plugin_ids.py
